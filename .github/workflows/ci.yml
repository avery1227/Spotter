name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System dependencies
        # ffmpeg for the encoder tests; the rest are what skia-python and
        # OpenCV link against at import time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libgl1 libgles2 libglib2.0-0 \
            libfontconfig1 libfreetype6 fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Headless OpenCV on a runner with no display.
          sed -i 's/^opencv-python>=/opencv-python-headless>=/' requirements.txt
          pip install -r requirements-dev.txt
          pip install pyflakes

      - name: Lint
        run: pyflakes spotter/ tests/ tools/ calibrate.py

      - name: Tests
        # The suite is hermetic: no network, no live stream.
        run: pytest -q --timeout=300

      - name: Egg is valid JSON and self-consistent
        run: python pelican/validate_egg.py

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build both targets
        run: |
          docker build --target runtime -t spotter:ci .
          docker build --target pelican -t spotter:ci-pelican .
      - name: Smoke test
        run: |
          docker run --rm spotter:ci doctor || true
          docker run --rm --entrypoint python spotter:ci-pelican \
            -c "import spotter, skia, av, cv2, flask, waitress; print('imports ok')"
