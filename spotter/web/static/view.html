<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotter</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e6edf3;
  }
  body.idle { cursor: none; }

  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #video {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  body.fill #video { object-fit: cover; }

  /* Chrome fades out on a wall display; any input brings it back. */
  .chrome {
    position: fixed; z-index: 10;
    transition: opacity .35s;
    opacity: 1;
  }
  body.idle .chrome { opacity: 0; }

  #stats {
    top: 14px; right: 14px;
    background: rgba(8,13,19,.72);
    border: 1px solid rgba(120,140,160,.28);
    border-radius: 8px; padding: 9px 13px;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px);
    min-width: 168px;
  }
  #stats .row { display: flex; justify-content: space-between; gap: 16px; }
  #stats .k { color: #8b9bab; }
  #stats.hidden { display: none; }

  #help {
    bottom: 14px; left: 14px;
    background: rgba(8,13,19,.72);
    border: 1px solid rgba(120,140,160,.28);
    border-radius: 8px; padding: 8px 12px; color: #8b9bab;
  }
  kbd {
    background: #1b2430; border: 1px solid #2a3644; border-radius: 4px;
    padding: 1px 6px; color: #e6edf3; font-family: inherit; font-size: 12px;
  }

  #banner {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.82); z-index: 20; text-align: center;
  }
  #banner.show { display: grid; }
  #banner .msg { font-size: 22px; }
  #banner .sub { color: #8b9bab; margin-top: 8px; font-size: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: #7ed957; margin-right: 7px; vertical-align: baseline; }
  .dot.bad { background: #ff5252; }
  .dot.warn { background: #ffb74d; }
</style>
</head>
<body>

<div id="stage"><img id="video" alt=""></div>

<div id="stats" class="chrome">
  <div class="row"><span class="k">source</span><span id="sState">—</span></div>
  <div class="row"><span class="k">fps</span><span id="sFps">—</span></div>
  <div class="row"><span class="k">lag</span><span id="sLag">—</span></div>
  <div class="row"><span class="k">aircraft</span><span id="sAir">—</span></div>
  <div class="row"><span class="k">ships</span><span id="sShips">—</span></div>
  <div class="row"><span class="k">labels</span><span id="sLabels">—</span></div>
</div>

<div id="help" class="chrome">
  <kbd>F</kbd> fullscreen &nbsp; <kbd>S</kbd> stats &nbsp;
  <kbd>C</kbd> fit/fill &nbsp; <kbd>R</kbd> reconnect &nbsp; <kbd>Esc</kbd> exit
</div>

<div id="banner">
  <div>
    <div class="msg" id="bannerMsg">Waiting for the pipeline…</div>
    <div class="sub" id="bannerSub">start it with <code>spotter run --web</code></div>
  </div>
</div>

<script src="/static/view.js"></script>
</body>
</html>
